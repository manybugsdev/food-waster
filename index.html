<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Waster - 食べ物投げ合いゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #score-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
        }
        #score-panel h2 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #ffcc00;
        }
        #score-panel p {
            margin: 5px 0;
        }
        #player-score {
            color: #00ff88;
        }
        #cpu-score {
            color: #ff6666;
        }
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
        }
        #controls-panel h3 {
            margin-bottom: 8px;
            color: #88ccff;
        }
        #health-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
        }
        #health-bar h3 {
            color: #ff6666;
            margin-bottom: 10px;
        }
        .health-container {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        .health-fill {
            height: 100%;
            transition: width 0.3s;
        }
        #player-health-fill {
            background: linear-gradient(90deg, #00ff88, #00cc66);
        }
        #cpu-health-fill {
            background: linear-gradient(90deg, #ff6666, #cc3333);
        }
        .health-label {
            color: white;
            font-size: 12px;
            margin-bottom: 3px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        #crosshair::after {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            display: none;
            pointer-events: auto;
        }
        #game-over h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        #game-over p {
            font-size: 24px;
            margin-bottom: 30px;
        }
        #restart-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            pointer-events: auto;
        }
        #start-screen h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }
        #start-screen p {
            font-size: 24px;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        #start-btn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border: none;
            color: white;
            padding: 20px 60px;
            font-size: 28px;
            border-radius: 40px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4);
        }
        #food-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
        }
        #food-indicator h3 {
            color: #ffcc00;
            margin-bottom: 10px;
        }
        #current-food {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div id="start-screen">
                <h1>🍕 Food Waster 🍔</h1>
                <p>食べ物を投げつけ合う3Dゲーム</p>
                <button id="start-btn">ゲーム開始</button>
            </div>
            <div id="score-panel" style="display: none;">
                <h2>スコア</h2>
                <p>プレイヤー: <span id="player-score">0</span></p>
                <p>CPU: <span id="cpu-score">0</span></p>
            </div>
            <div id="health-bar" style="display: none;">
                <h3>体力</h3>
                <div class="health-label">プレイヤー</div>
                <div class="health-container">
                    <div class="health-fill" id="player-health-fill" style="width: 100%;"></div>
                </div>
                <div class="health-label">CPU</div>
                <div class="health-container">
                    <div class="health-fill" id="cpu-health-fill" style="width: 100%;"></div>
                </div>
            </div>
            <div id="controls-panel" style="display: none;">
                <h3>操作方法</h3>
                <p>WASD: 移動</p>
                <p>マウス: 視点操作</p>
                <p>クリック: 投げる</p>
                <p>スペース: ジャンプ</p>
                <p>Q/E: 食べ物変更</p>
            </div>
            <div id="food-indicator" style="display: none;">
                <h3>現在の食べ物</h3>
                <div id="current-food">🍕 ピザ</div>
            </div>
            <div id="crosshair" style="display: none;"></div>
            <div id="game-over">
                <h1 id="game-over-title">ゲームオーバー</h1>
                <p id="game-over-message">メッセージ</p>
                <button id="restart-btn">もう一度プレイ</button>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
